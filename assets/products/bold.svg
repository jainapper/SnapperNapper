<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260" role="img" aria-label="FYBRE Bold — performance shampoo pump bottle">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F4F2EC"/>
      <stop offset="1" stop-color="#DEDCD4"/>
    </linearGradient>
    <linearGradient id="pump" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2A2A2E"/>
      <stop offset="0.5" stop-color="#0A0A0B"/>
      <stop offset="1" stop-color="#1C1C20"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="100" cy="246" rx="58" ry="8" fill="#000000" opacity="0.4" filter="url(#soft)"/>

  <!-- pump head: nozzle arm + stem -->
  <path d="M92 30 h36 q6 0 6 6 v6 q0 4 -4 4 h-18 v-4 h14 v-6 h-34 Z" fill="url(#pump)"/>
  <rect x="92" y="30" width="16" height="26" rx="3" fill="url(#pump)"/>
  <!-- stem + collar -->
  <rect x="96" y="56" width="8" height="14" fill="#141416"/>
  <rect x="82" y="70" width="36" height="16" rx="3" fill="url(#pump)"/>

  <!-- bottle body — wider stance -->
  <path d="M54 100 q0 -14 16 -14 h60 q16 0 16 14 v122 q0 16 -16 16 h-60 q-16 0 -16 -16 Z" fill="url(#body)"/>
  <!-- specular highlight -->
  <rect x="63" y="98" width="7" height="128" rx="3.5" fill="#FFFFFF" opacity="0.8"/>

  <!-- volt band -->
  <rect x="54" y="108" width="92" height="10" fill="#C8FF2E"/>

  <!-- label: growth bars + rules -->
  <g transform="translate(78 140)">
    <path d="M0 38 V24.13 A3.61 3.61 0 0 1 7.22 24.13 V38 Z M12.35 38 V13.87 A3.61 3.61 0 0 1 19.57 13.87 V38 Z M24.7 38 V3.61 A3.61 3.61 0 0 1 31.92 3.61 V38 Z" fill="#0A0A0B"/>
  </g>
  <rect x="78" y="192" width="44" height="3" fill="#0A0A0B"/>
  <rect x="78" y="202" width="30" height="2" fill="#0A0A0B" opacity="0.45"/>
  <rect x="78" y="209" width="36" height="2" fill="#0A0A0B" opacity="0.45"/>
  <rect x="78" y="220" width="12" height="4" fill="#C8FF2E" stroke="#0A0A0B" stroke-width="0.5"/>
</svg>
