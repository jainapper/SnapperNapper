<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260" role="img" aria-label="FYBRE Growth Kit — the complete system box">
  <defs>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1B1B1F"/>
      <stop offset="0.5" stop-color="#0E0E10"/>
      <stop offset="1" stop-color="#060607"/>
    </linearGradient>
    <linearGradient id="lid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E2E34"/>
      <stop offset="1" stop-color="#1B1B1F"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="100" cy="248" rx="70" ry="9" fill="#000000" opacity="0.4" filter="url(#soft)"/>

  <!-- box -->
  <rect x="32" y="52" width="136" height="188" rx="10" fill="url(#face)" stroke="#3A3A40" stroke-width="1"/>
  <!-- lid -->
  <path d="M32 62 q0 -10 10 -10 h116 q10 0 10 10 v24 H32 Z" fill="url(#lid)"/>
  <rect x="32" y="85" width="136" height="1.5" fill="#C8FF2E" opacity="0.9"/>

  <!-- volt growth bars, large -->
  <g transform="translate(72 116)">
    <path d="M0 64 V40.64 A6.08 6.08 0 0 1 12.16 40.64 V64 Z M20.8 64 V23.36 A6.08 6.08 0 0 1 32.96 23.36 V64 Z M41.6 64 V6.08 A6.08 6.08 0 0 1 53.76 6.08 V64 Z" fill="#C8FF2E"/>
  </g>

  <!-- label rules -->
  <rect x="72" y="198" width="56" height="3" fill="#F2F0EA"/>
  <rect x="72" y="208" width="38" height="2" fill="#F2F0EA" opacity="0.4"/>
  <rect x="72" y="215" width="46" height="2" fill="#F2F0EA" opacity="0.4"/>
</svg>
