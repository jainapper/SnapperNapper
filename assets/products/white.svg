<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260" role="img" aria-label="FYBRE White — day serum dropper bottle">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F4F2EC"/>
      <stop offset="1" stop-color="#DEDCD4"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2A2A2E"/>
      <stop offset="0.5" stop-color="#0A0A0B"/>
      <stop offset="1" stop-color="#1C1C20"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- ground shadow -->
  <ellipse cx="100" cy="244" rx="52" ry="8" fill="#000000" opacity="0.4" filter="url(#soft)"/>

  <!-- dropper bulb -->
  <path d="M86 44 a14 14 0 0 1 28 0 v6 H86 Z" fill="url(#cap)"/>
  <!-- dropper collar -->
  <rect x="80" y="50" width="40" height="32" rx="4" fill="url(#cap)"/>
  <rect x="86" y="56" width="4" height="20" rx="2" fill="#FFFFFF" opacity="0.14"/>
  <!-- neck -->
  <rect x="86" y="82" width="28" height="12" fill="#DEDCD4"/>

  <!-- bottle body -->
  <path d="M62 106 q0 -12 14 -12 h48 q14 0 14 12 v112 q0 14 -14 14 h-48 q-14 0 -14 -14 Z" fill="url(#body)"/>
  <!-- specular highlight -->
  <rect x="70" y="104" width="6" height="118" rx="3" fill="#FFFFFF" opacity="0.8"/>

  <!-- label: growth bars + rules -->
  <g transform="translate(83 138)">
    <path d="M0 34 V21.59 A3.23 3.23 0 0 1 6.46 21.59 V34 Z M11.05 34 V12.41 A3.23 3.23 0 0 1 17.51 12.41 V34 Z M22.1 34 V3.23 A3.23 3.23 0 0 1 28.56 3.23 V34 Z" fill="#0A0A0B"/>
  </g>
  <rect x="83" y="186" width="34" height="3" fill="#0A0A0B"/>
  <rect x="83" y="196" width="24" height="2" fill="#0A0A0B" opacity="0.45"/>
  <rect x="83" y="203" width="28" height="2" fill="#0A0A0B" opacity="0.45"/>
  <!-- volt dose mark -->
  <rect x="83" y="214" width="12" height="4" fill="#C8FF2E" stroke="#0A0A0B" stroke-width="0.5"/>
</svg>
