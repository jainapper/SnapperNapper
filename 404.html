<!doctype html>
<html lang="en">
<head>

  <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .nf {
      min-height: 100svh;
      display: grid;
      place-content: center;
      justify-items: center;
      text-align: center;
      gap: 1.1rem;
      background: var(--ink);
      color: var(--text-inv);
      padding: 2rem;

      font-family: var(--font-mono);
      font-size: 0.8rem;
      letter-spacing: 0.16em;
      color: var(--gold-soft);
    }
    .nf p { color: var(--muted-inv); max-width: 26em; }

<body>
  <main class="nf">
    <svg viewBox="0 0 96 96" aria-hidden="true">
      <path d="M 72.523 25.921 A 33 33 0 1 0 72.523 70.079" fill="none" stroke="#C9A227" stroke-width="9" stroke-linecap="round"/>
      <path d="M 33 34 L 48 63 L 63 34" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="miter"/>
    </svg>
    <p class="nf-code">404 — NOT FOUND</p>
    <h1>This route doesn't exist.</h1>
    <p>The page you're looking for has moved or never shipped. Let's get you back on course.</p>
    <a class="btn btn-gold" href="/">Back to vcltd.co</a>

</html>
