<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — VC Limited</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/brand/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .nf {
      min-height: 100svh;
      display: grid;
      place-content: center;
      justify-items: center;
      text-align: center;
      gap: 1.1rem;
      background: var(--black);
      color: var(--text-inv);
      padding: 2rem;
    }
    .nf svg { width: 72px; height: 72px; }
    .nf-code {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      letter-spacing: 0.16em;
      color: var(--orange-soft);
    }
    .nf p { color: var(--muted-inv); max-width: 26em; }
  </style>
</head>
<body>
  <main class="nf">
    <svg viewBox="0 0 96 96" aria-hidden="true">
      <path d="M 24 32 L 46 74 L 74 20" fill="none" stroke="#fff" stroke-width="11" stroke-linecap="butt" stroke-linejoin="miter"/>
      <circle cx="74" cy="20" r="8.5" fill="#FF4D00"/>
    </svg>
    <p class="nf-code">404 — NOT FOUND</p>
    <h1>This route doesn't exist.</h1>
    <p>The page you're looking for has moved or never shipped. Let's reroute you.</p>
    <a class="btn btn-orange" href="/">Back to vcltd.co</a>
  </main>
</body>
</html>
